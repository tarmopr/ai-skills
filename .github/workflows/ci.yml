name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test 'hooks/*.test.mjs' 'skills/*/scripts/*.test.mjs'

      # C4's private patterns are not in this public repo, so CI checks staging host names only.
      - name: Skill shape check
        run: node scripts/check-skills.mjs

      - name: Version bump
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git diff --quiet "$BASE"...HEAD -- skills hooks; then
            echo "no change under skills/ or hooks/: no bump needed"
          elif git diff --quiet "$BASE"...HEAD -- .claude-plugin/plugin.json; then
            echo "::error file=.claude-plugin/plugin.json::skills/ or hooks/ changed: bump version in .claude-plugin/plugin.json"
            exit 1
          else
            echo "version bumped"
          fi
